services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
 
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 29092"]
      interval: 15s
      timeout: 10s
      retries: 10
 
  kafka-setup:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-events --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic content-metadata --partitions 1 --replication-factor 1 --config cleanup.policy=compact &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic feature-store --partitions 1 --replication-factor 1 --config cleanup.policy=compact &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic flink-metrics --partitions 1 --replication-factor 1 &&
        echo 'All topics created successfully'
      "
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-topics --bootstrap-server kafka:29092 --list | grep feature-store"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  flink-jobmanager:
    image: flink:1.17.1-scala_2.12
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        rest.address: 0.0.0.0
        rest.port: 8081
        taskmanager.numberOfTaskSlots: 4
    # The JAR goes into /opt/flink/lib so Flink loads it on startup — no -C flag needed
    volumes:
      - ./flink/lib:/opt/flink/lib/extra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/overview"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  flink-taskmanager:
    image: flink:1.17.1-scala_2.12
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink/lib:/opt/flink/lib/extra
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://flink-jobmanager:8081/v1/taskmanagers | grep -q taskmanagers"]
      interval: 10s
      timeout: 5s
      retries: 10
 
  # This service BUILDS the custom PyFlink image and submits the job
  flink-pipeline:
    build:
      context: ./flink
      dockerfile: Dockerfile
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - FLINK_JOBMANAGER_HOST=flink-jobmanager
      - FLINK_JOBMANAGER_PORT=8081
    # PyFlink jobs run as a Python process that connects to the remote cluster
    # The pipeline.py uses REST submission mode (via env vars)
    command: >
      bash -c "
        echo 'Waiting for TaskManager slots...' &&
        sleep 10 &&
        echo 'Submitting PyFlink job...' &&
        cd /opt/flink/usrlib &&
        python pipeline.py
      "
 
  producer:
    build: ./producer
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('kafka',29092)); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 5
 
  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5